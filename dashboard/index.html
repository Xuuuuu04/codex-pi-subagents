<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi 调度台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="子代理列表">
      <div class="side-top">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12.5" class="ring"/>
            <circle cx="16" cy="16" r="3.6" class="core"/>
            <circle cx="16" cy="3.5" r="2.4" class="orbit"/>
          </svg>
          <span class="brand-name">Pi 调度台</span>
          <span id="connection" class="conn-pill conn-poll">连接中</span>
        </div>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4 4"/></svg>
        <input id="search" type="search" placeholder="搜索名称、会话、模型或路径" aria-label="搜索子代理">
        <kbd>/</kbd>
      </label>

      <div class="chip-bar" id="host-chips" role="group" aria-label="按宿主筛选"></div>
      <div class="chip-bar" id="chips" role="group" aria-label="按状态筛选"></div>

      <nav class="list" id="list" aria-label="分组会话"></nav>

      <div class="side-foot">
        <div class="dist" id="dist" aria-label="会话状态分布"></div>
        <div class="totals" id="totals"></div>
        <div class="side-actions">
          <button type="button" class="btn btn-xs" id="settings-btn" title="模型、Key 与子代理工具设置 (,)">设置</button>
          <button type="button" class="btn btn-xs" id="sys-btn">状态与额度</button>
          <button type="button" class="btn btn-xs" id="notify" title="等待答复时发送桌面通知">通知</button>
          <button type="button" class="btn btn-xs" id="theme" title="切换深浅色主题">深色</button>
          <button type="button" class="btn btn-xs" id="pause" title="暂停实时更新 (P)">暂停</button>
          <button type="button" class="btn btn-xs" id="help-btn" title="快捷键与说明 (?)">?</button>
        </div>
      </div>
    </aside>

    <div class="resizer" data-resize="side" role="separator" aria-orientation="vertical" aria-label="调整左侧栏宽度" tabindex="0"></div>

    <main class="main">
      <header class="main-head">
        <button type="button" class="btn btn-xs" id="side-toggle" title="展开/收起侧栏">列表</button>
        <div class="views" id="views"></div>
        <label class="thread-search-box">
          <input id="thread-search" type="search" placeholder="在当前对话内搜索…" aria-label="对话内搜索">
          <span class="thread-count muted" id="thread-count"></span>
        </label>
        <button type="button" class="btn btn-xs" id="panel-toggle" title="显示/隐藏右侧详情">详情</button>
      </header>

      <div class="dock" id="dock">
        <div class="dock-alerts" id="d-alerts" hidden></div>
        <div class="dock-now" id="d-now"></div>
      </div>

      <div class="pr-bar" id="thread-prs"></div>

      <section class="thread" aria-label="子代理对话与工具输出">
        <div class="records" id="records"></div>
      </section>
    </main>

    <div class="resizer" data-resize="panel" role="separator" aria-orientation="vertical" aria-label="调整右侧详情宽度" tabindex="0"></div>

    <aside class="panel" id="panel" aria-label="子代理详情">
      <header class="panel-head">
        <nav class="ptabs" id="ptabs" role="tablist" aria-label="详情标签页">
          <button type="button" role="tab" data-tab="status" class="active">状态</button>
          <button type="button" role="tab" data-tab="speed">速度</button>
          <button type="button" role="tab" data-tab="lane">工具轨</button>
          <button type="button" role="tab" data-tab="context">上下文</button>
          <button type="button" role="tab" data-tab="changes">改动</button>
        </nav>
      </header>
      <div class="panel-body">
        <div id="p-status"></div>
        <div id="p-speed" hidden></div>
        <div id="lane" hidden></div>
        <div id="p-context" hidden></div>
        <div id="p-changes" hidden></div>
      </div>
    </aside>
  </div>

  <div class="chart-tip" id="chart-tip" hidden></div>
  <div class="menu" id="menu" role="menu" hidden></div>
  <dialog class="dialog" id="dialog"></dialog>
  <dialog class="dialog" id="sys-dialog"></dialog>
  <dialog class="dialog" id="settings-dialog"></dialog>
  <dialog class="dialog" id="help-dialog">
    <div class="dialog-box">
      <div class="dialog-head">
        <strong>快捷键与使用说明</strong>
        <button type="button" class="btn btn-xs" data-close>关闭</button>
      </div>
      <div class="dialog-body">
        <div class="shortcut-list">
          <div class="kv-row"><span><kbd>/</kbd></span><span>聚焦左侧搜索框</span></div>
          <div class="kv-row"><span><kbd>j</kbd> / <kbd>k</kbd></span><span>切换下一条 / 上一条子代理</span></div>
          <div class="kv-row"><span><kbd>[</kbd> / <kbd>]</kbd></span><span>切换右侧详情标签页</span></div>
          <div class="kv-row"><span><kbd>p</kbd></span><span>暂停或恢复实时推送</span></div>
          <div class="kv-row"><span><kbd>,</kbd></span><span>打开模型、Key 与子代理设置</span></div>
          <div class="kv-row"><span><kbd>?</kbd></span><span>打开或关闭本说明窗口</span></div>
          <div class="kv-row"><span><kbd>Esc</kbd></span><span>关闭弹窗、菜单或清空聚焦搜索</span></div>
        </div>
        <p class="muted help-note">面板默认只读查看子代理运行记录；分组与状态标记保存在面板自有文件，设置弹窗中的模型、策略与凭据修改会先经 0600 备份后写入对应配置。</p>
      </div>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
