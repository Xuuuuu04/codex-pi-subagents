<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi 调度台</title>
  <link rel="stylesheet" href="/style.css"><script src="/conversation.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="currentColor"/><circle cx="16" cy="4.5" r="2.6" class="orbit"/><path d="M16 20v6M10.5 13.5 6 11M21.5 13.5 26 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <div><h1>Pi 调度台</h1><span>Codex × Pi 子代理</span></div>
    </div>
    <div class="overview" aria-label="会话分布">
      <div class="dist" id="dist" role="img" aria-label="会话状态分布"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="top-actions">
      <div class="totals" id="totals"></div>
      <span class="live" id="live" role="status"><i></i><b id="connection">正在连接</b></span>
      <button type="button" class="icon-btn" id="notify" title="状态变化时提醒" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg></button>
      <button type="button" class="icon-btn" id="theme" title="切换明暗"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      <button type="button" class="pill-btn" id="pause" title="暂停 / 继续（P）">暂停</button>
    </div>
  </header>

  <div id="error" class="banner" role="alert" hidden></div>

  <main class="layout">
    <aside class="sessions" aria-label="会话列表">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="search" type="search" placeholder="搜索名称、模型、目录、身份" aria-label="搜索会话"><kbd>/</kbd>
      </div>
      <div class="chips" id="chips" role="group" aria-label="按状态筛选"></div>
      <div class="list" id="list"></div>
      <p class="list-empty" id="empty" hidden></p>
    </aside>

    <section class="detail" id="detail-pane" aria-label="会话详情">
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 120 80" aria-hidden="true"><path d="M8 60h104" class="axis"/><path d="M14 52 32 40l16 8 18-22 16 12 22-20" class="trace"/><circle cx="104" cy="18" r="4" class="dot"/></svg>
        <p id="placeholder-text">正在读取本机会话</p>
      </div>
      <article id="detail" hidden>
        <div class="d-head">
          <div class="d-title">
            <span class="status" id="d-status"></span>
            <h2 id="d-name"></h2>
            <p id="d-model"></p>
          </div>
          <div class="d-actions">
            <div class="clock"><span>已用时</span><b id="d-elapsed">—</b></div>
            <button type="button" class="pill-btn" data-copy="id">复制身份</button>
            <button type="button" class="pill-btn" data-copy="cwd">复制目录</button>
          </div>
        </div>

        <div class="now" id="d-now"></div>

        <section class="track" aria-label="进度轨道">
          <div class="track-head"><h3>进度轨道</h3><div class="track-key"><span class="k-tool">工具</span><span class="k-err">失败</span><span class="k-comm">通信</span><span class="k-life">生命周期</span></div></div>
          <div class="lane-wrap" id="lane-wrap"><svg id="lane" role="img" aria-label="会话时间线"></svg><div class="tip" id="tip" hidden></div></div>
          <div class="axis-labels"><span id="axis-start"></span><span id="axis-mid"></span><span id="axis-end"></span></div>
        </section>

        <dl class="figures" id="d-figures"></dl>
        <div id="d-alerts"></div>
        <blockquote class="report" id="d-report" hidden><span>最近报告</span><p></p></blockquote>

        <nav class="tabs" role="tablist" aria-label="会话记录">
          <button type="button" role="tab" data-tab="messages">实时对话</button>
          <button type="button" role="tab" data-tab="tools">工具统计</button>
          <button type="button" role="tab" data-tab="events">事件流</button>
          <button type="button" role="tab" data-tab="result">最近结果</button>
          <button type="button" role="tab" data-tab="info">会话信息</button>
        </nav>
        <div class="records" id="records"></div>
        <p class="note" id="record-note"></p>
      </article>
    </section>
  </main>

  <footer class="foot">本机只读 · 每 2 秒更新 · 已完成只代表模型执行结束，成果仍需检查 · 提问答复、指导和中断由所属聊天处理<span class="keys"><kbd>/</kbd>搜索 <kbd>J</kbd><kbd>K</kbd>切换 <kbd>P</kbd>暂停</span></footer>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
